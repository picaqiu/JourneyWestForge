[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "journeywest-agent-runtime"
version = "0.1.0"
description = "Production AI runtime experiments for JourneyWestForge"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2.12,<3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
